<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>dalin</title>
    <meta name="apple-mobile-web-app-title" content="dalin">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3737/3737372.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3737/3737372.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root { --primary: #2c3e50; --accent: #007bff; --danger: #e74c3c; --success: #27ae60; --warning: #e67e22; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); margin: 0; padding: 10px; color: var(--primary); min-height: 100vh; }
        .container { max-width: 800px; margin: auto; background: rgba(255, 255, 255, 0.98); padding: 15px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); border-top: 6px solid var(--accent); }
        h1 { text-align: center; color: var(--accent); margin-bottom: 5px; font-size: 24px; }
        .owner-name { text-align: center; color: #34495e; margin-top: -5px; margin-bottom: 20px; font-size: 16px; font-weight: bold; }
        
        .currency-selector { background: #eaf2f8; padding: 10px; border-radius: 8px; text-align: center; font-size: 15px; font-weight: bold; margin-bottom: 15px; border: 1px solid #d6eaf8; }
        .currency-selector input[type="radio"] { transform: scale(1.2); margin: 0 5px; }
        
        .table-responsive { width: 100%; overflow-x: auto; margin-bottom: 15px; }
        table { width: 100%; min-width: 320px; border-collapse: collapse; table-layout: fixed; }
        th { background: #f8f9fa; padding: 8px 2px; border-bottom: 2px solid #ddd; font-size: 13px; text-align: center; }
        td { padding: 5px 2px; border-bottom: 1px solid #eee; text-align: center; }
        .row-num-cell { font-weight: bold; color: var(--accent); font-size: 14px; width: 10%; }
        
        input[type="number"], input[type="text"] { width: 100%; padding: 10px 4px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; text-align: center; outline: none; background: #fff; -webkit-appearance: none; }
        input:focus { border-color: var(--accent); background: #f0f8ff; }
        input.row-total { background-color: #e8f0fe; font-weight: bold; color: var(--primary); pointer-events: none; border: none; }
        
        .action-btns { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .top-btns { display: flex; gap: 10px; }
        .btn { color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; text-align: center; flex: 1; }
        .btn-add { background: var(--accent); }
        .btn-remove { background: var(--warning); }
        .btn-clear { background: var(--danger); }
        .btn-save { background: var(--success); width: 100%; }
        
        .total-section { background: var(--primary); color: white; padding: 15px; border-radius: 8px; text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        .total-converted { font-size: 15px; opacity: 0.9; margin-top: 5px; font-weight: normal; }
        
        /* گەڕاندنەوەی بەشی دۆلار و دینار لە خوارەوە */
        .bottom-panel { background: #fdfefe; border: 1px solid #eaeded; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;}
        .rate-box { text-align: center; font-size: 15px; font-weight: bold; padding-bottom: 10px; border-bottom: 1px dashed #ddd; }
        .rate-box input { width: 100px; display: inline-block; padding: 6px; }
        .converter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center; }
        .convert-box { background: #f4f6f7; padding: 10px; border-radius: 6px; font-size: 13px; }
        .convert-box input { width: 90%; margin: 8px auto; display: block; padding: 6px; }
        .convert-box span { display: block; margin-top: 5px; font-size: 14px; font-weight: bold; color: var(--danger); }

        .history-section { margin-top: 10px; background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
        .history-section h3 { text-align: center; margin: 0 0 15px 0; color: #2c3e50; font-size: 16px; }
        .history-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
        .history-card { background: #fdfdfd; border: 1px solid #e1e8ed; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .history-card:active { background: #eaf2f8; transform: scale(0.98); }
        .history-date { color: #7f8c8d; font-size: 13px; font-weight: bold; }
        .history-amount { font-weight: bold; color: var(--success); font-size: 16px; }

        .designer-name { text-align: center; margin-top: 25px; color: #7f8c8d; font-size: 14px; font-weight: bold; border-top: 1px dashed #ccc; padding-top: 15px; }

        /* پەنجەرەی گەورەبوونەوەی وەسڵ و چارەسەری بۆشاییەکان */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; padding: 15px; }
        .modal-content { background: #fff; width: 100%; max-width: 400px; border-radius: 12px; padding: 20px; max-height: 90vh; overflow-y: auto; position: relative; }
        
        .receipt-print { background: #fff; padding: 25px; border: 2px solid #333; border-radius: 8px; margin-bottom: 20px; }
        .receipt-print h2 { text-align: center; margin: 0 0 5px 0; color: #333; }
        .receipt-print p { text-align: center; margin: 0 0 20px 0; color: #555; font-size: 14px; }
        .receipt-print table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .receipt-print th, .receipt-print td { border: 1px solid #ccc; padding: 10px; text-align: center; font-size: 14px; color: #333; }
        .receipt-print th { background: #eee; }
        
        /* جوانکردن و دوورخستنەوەی کۆی گشتی لە وەسڵی پاشەکەوتکراو */
        .receipt-total { text-align: left; font-size: 18px; font-weight: bold; color: var(--success); padding-top: 15px; margin-top: 10px; border-top: 2px dashed #999; }
        
        .modal-btns { display: flex; gap: 10px; }
        .btn-download { background: var(--accent); flex: 2; }
        .btn-close { background: var(--danger); flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <h1>تایبەت بە مارکێتی دەلین</h1>
    <div class="owner-name">خاوەنی: عمر علی</div>

    <div class="currency-selector">
        پارەی وەسڵەکە: 
        <label><input type="radio" name="currencyMode" value="IQD" checked onchange="calculateAll()"> دینار</label>
        <label><input type="radio" name="currencyMode" value="USD" onchange="calculateAll()"> دۆلار</label>
    </div>

    <div class="table-responsive">
        <table id="invoiceTable">
            <thead>
                <tr>
                    <th style="width: 12%;">#</th>
                    <th style="width: 33%;">بابەت</th>
                    <th style="width: 15%;">بڕ</th>
                    <th style="width: 20%;">نرخ</th>
                    <th style="width: 20%;">کۆ</th>
                </tr>
            </thead>
            <tbody id="itemsBody">
                <tr>
                    <td class="row-num-cell">١</td>
                    <td><input type="text" placeholder="ناو"></td>
                    <td><input type="number" class="qty" min="0" placeholder="١" oninput="calculateAll()"></td>
                    <td><input type="number" class="price" min="0" placeholder="نرخ" oninput="calculateAll()"></td>
                    <td><input type="text" class="row-total" placeholder="٠" readonly></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="action-btns">
        <div class="top-btns">
            <button class="btn btn-add" onclick="addRow()">+ زیادکردن</button>
            <button class="btn btn-remove" onclick="removeEmptyRows()">- کەمکردنەوە</button>
            <button class="btn btn-clear" onclick="clearAll()">پاککردنەوە</button>
        </div>
        <button class="btn btn-save" onclick="saveReceipt()">💾 پاشەکەوتکردنی وەسڵ</button>
    </div>

    <div class="total-section">
        کۆی گشتی: <span id="grandTotal">0</span> <span id="mainCurrencySymbol">دینار</span>
        <div class="total-converted">
            بەرامبەرە بە: <span id="convertedTotal">0</span> <span id="convertedCurrencySymbol">دۆلار</span>
        </div>
    </div>

    <div class="bottom-panel">
        <div class="rate-box">
            ١٠٠ دۆلار: 
            <input type="number" id="dollarRate" min="0" value="150000" oninput="calculateAll(); convertUsdToIqd(); convertIqdToUsd();"> دینار
        </div>

        <div class="converter-grid">
            <div class="convert-box">
                دۆلار ⬅️ دینار<br>
                <input type="number" id="calcUSD" min="0" placeholder="$" oninput="convertUsdToIqd()">
                <span id="resIQD">0 دینار</span>
            </div>
            <div class="convert-box">
                دینار ⬅️ دۆلار<br>
                <input type="number" id="calcIQD" min="0" placeholder="دینار" oninput="convertIqdToUsd()">
                <span id="resUSD">0 دۆلار</span>
            </div>
        </div>
    </div>

    <div class="history-section">
        <h3>وەسڵە پاشەکەوتکراوەکان (١٠ی کۆتایی)</h3>
        <p style="text-align:center; font-size:12px; color:#999; margin-top:-10px;">کلیک لە وەسڵێک بکە بۆ بینین و دابەزاندن</p>
        <ul class="history-list" id="historyList"></ul>
    </div>

    <div class="designer-name">
        دیزاین و دروستکردنی: شیروان
    </div>
</div>

<div class="modal" id="receiptModal">
    <div class="modal-content">
        <div id="modalBody"></div>
        <div class="modal-btns">
            <button class="btn btn-download" onclick="downloadReceiptImage()">📥 دابەزاندن بۆ مۆبایل</button>
            <button class="btn btn-close" onclick="closeModal()">داخستن</button>
        </div>
    </div>
</div>

<script>
    window.onload = function() { loadHistory(); calculateAll(); };

    function updateRowNumbers() {
        const rows = document.querySelectorAll('#itemsBody tr');
        rows.forEach((row, index) => { row.querySelector('.row-num-cell').innerText = index + 1; });
    }

    function addRow() {
        const tbody = document.getElementById('itemsBody');
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="row-num-cell"></td>
            <td><input type="text" placeholder="ناو"></td>
            <td><input type="number" class="qty" min="0" placeholder="١" oninput="calculateAll()"></td>
            <td><input type="number" class="price" min="0" placeholder="نرخ" oninput="calculateAll()"></td>
            <td><input type="text" class="row-total" placeholder="٠" readonly></td>
        `;
        tbody.appendChild(tr);
        updateRowNumbers();
    }

    function removeEmptyRows() {
        const rows = document.querySelectorAll('#itemsBody tr');
        let removedAnything = false;

        rows.forEach(row => {
            if (rows.length > 1) { 
                const name = row.querySelector('input[type="text"]').value.trim();
                const price = parseFloat(row.querySelector('.price').value) || 0;
                
                if (name === "" && price === 0) {
                    row.remove();
                    removedAnything = true;
                }
            }
        });

        if (removedAnything) {
            updateRowNumbers();
            calculateAll();
        } else {
            alert("هیچ خانەیەکی بەتاڵ نییە بۆ سڕینەوە!");
        }
    }

    function calculateAll() {
        const rows = document.querySelectorAll('#itemsBody tr');
        let grandTotal = 0;
        
        let rateInputValue = document.getElementById('dollarRate').value;
        const rateInput = rateInputValue === "" ? 150000 : parseFloat(rateInputValue);
        const oneDollarRate = rateInput / 100;
        
        const currencyMode = document.querySelector('input[name="currencyMode"]:checked').value;

        document.getElementById('mainCurrencySymbol').innerText = currencyMode === 'IQD' ? 'دینار' : 'دۆلار';
        document.getElementById('convertedCurrencySymbol').innerText = currencyMode === 'IQD' ? 'دۆلار' : 'دینار';

        rows.forEach(row => {
            const qtyStr = row.querySelector('.qty').value;
            const qty = qtyStr === "" ? 1 : parseFloat(qtyStr);
            const price = parseFloat(row.querySelector('.price').value) || 0;
            const total = qty * price;
            row.querySelector('.row-total').value = total > 0 ? total.toLocaleString() : "";
            grandTotal += total;
        });

        document.getElementById('grandTotal').innerText = grandTotal.toLocaleString();
        
        if(oneDollarRate > 0) {
            let converted = currencyMode === 'IQD' ? grandTotal / oneDollarRate : grandTotal * oneDollarRate;
            document.getElementById('convertedTotal').innerText = currencyMode === 'IQD' ? converted.toFixed(2) : Math.round(converted).toLocaleString();
        }
    }

    function convertUsdToIqd() {
        const usd = parseFloat(document.getElementById('calcUSD').value) || 0;
        const oneDollarRate = (document.getElementById('dollarRate').value || 150000) / 100;
        const result = usd * oneDollarRate;
        document.getElementById('resIQD').innerText = result > 0 ? result.toLocaleString() + " دینار" : "0 دینار";
    }

    function convertIqdToUsd() {
        const iqd = parseFloat(document.getElementById('calcIQD').value) || 0;
        const oneDollarRate = (document.getElementById('dollarRate').value || 150000) / 100;
        if(oneDollarRate > 0) {
            const result = iqd / oneDollarRate;
            document.getElementById('resUSD').innerText = result > 0 ? result.toFixed(2) + " دۆلار" : "0 دۆلار";
        }
    }

    function clearAll() {
        if(confirm("ئایا دڵنیای لە پاککردنەوە؟")) {
            document.getElementById('itemsBody').innerHTML = ''; addRow();
            document.getElementById('grandTotal').innerText = '0';
            document.getElementById('convertedTotal').innerText = '0';
            document.getElementById('calcUSD').value = '';
            document.getElementById('calcIQD').value = '';
            document.getElementById('resIQD').innerText = '0 دینار';
            document.getElementById('resUSD').innerText = '0 دۆلار';
        }
    }

    function saveReceipt() {
        const grandTotal = document.getElementById('grandTotal').innerText;
        if(grandTotal === "0" || grandTotal === "") return alert("وەسڵەکە بەتاڵە، ناتوانیت پاشەکەوتی بکەیت!");

        let items = [];
        document.querySelectorAll('#itemsBody tr').forEach(row => {
            const priceStr = row.querySelector('.price').value;
            const price = parseFloat(priceStr) || 0;
            if(price > 0) {
                const qtyStr = row.querySelector('.qty').value;
                items.push({
                    name: row.querySelector('input[type="text"]').value || "کاڵای بێناو",
                    qty: qtyStr === "" ? 1 : qtyStr,
                    price: price.toLocaleString(),
                    total: row.querySelector('.row-total').value
                });
            }
        });

        const receipt = {
            date: new Date().toLocaleDateString('en-GB') + " | " + new Date().toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'}),
            total: grandTotal + " " + document.getElementById('mainCurrencySymbol').innerText,
            items: items
        };

        let history = JSON.parse(localStorage.getItem('dalinFull')) || [];
        history.unshift(receipt);
        if(history.length > 10) history.pop();
        localStorage.setItem('dalinFull', JSON.stringify(history));
        
        loadHistory();
        clearAll();
    }

    function loadHistory() {
        const list = document.getElementById('historyList');
        list.innerHTML = '';
        const history = JSON.parse(localStorage.getItem('dalinFull')) || [];
        if(history.length === 0) return list.innerHTML = '<li style="text-align:center; color:#999; padding: 10px;">هیچ وەسڵێک نییە</li>';

        history.forEach((rec, idx) => {
            const li = document.createElement('li');
            li.className = 'history-card';
            li.onclick = function() { openReceiptModal(idx); }; 
            
            li.innerHTML = `
                <span class="history-date">#${idx+1} &nbsp; ${rec.date}</span>
                <span class="history-amount">${rec.total}</span>
            `;
            list.appendChild(li);
        });
    }

    function openReceiptModal(index) {
        const history = JSON.parse(localStorage.getItem('dalinFull')) || [];
        const rec = history[index];
        if(!rec) return;

        let tableRows = '';
        rec.items.forEach(it => {
            tableRows += `<tr><td>${it.name}</td><td>${it.qty}</td><td>${it.price}</td><td>${it.total}</td></tr>`;
        });

        const printArea = `
            <div id="captureArea" class="receipt-print" dir="rtl">
                <h2>مارکێتی دەلین</h2>
                <p>خاوەنی: عمر علی<br><span style="direction: ltr; display: inline-block; margin-top:5px;">${rec.date}</span></p>
                <table>
                    <tr><th>بابەت</th><th>بڕ</th><th>نرخ</th><th>کۆ</th></tr>
                    ${tableRows}
                </table>
                <div class="receipt-total">کۆی گشتی: ${rec.total}</div>
            </div>
        `;

        document.getElementById('modalBody').innerHTML = printArea;
        document.getElementById('receiptModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('receiptModal').style.display = 'none';
    }

    function downloadReceiptImage() {
        const target = document.getElementById('captureArea');
        html2canvas(target, { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'wasl_dalin.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }
</script>

</body>
</html>
